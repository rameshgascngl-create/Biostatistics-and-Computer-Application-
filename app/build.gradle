plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gasc.zoology.biostat'
    compileSdk 34

    defaultConfig {
        applicationId "com.gasc.zoology.biostat"
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName "3.2-complete"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    packagingOptions {
        resources {
            excludes += ['DebugProbesKt.bin', 'META-INF/*.version']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
