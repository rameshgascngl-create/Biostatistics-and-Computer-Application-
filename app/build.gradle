plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Release signing is read from environment variables (set as GitHub Actions
// secrets). If they are absent the release build is produced unsigned.
def ksPath = System.getenv('BIOSTAT_KEYSTORE_PATH')

android {
    namespace 'com.gasc.zoology.biostat'
    compileSdk 36

    defaultConfig {
        applicationId "com.gasc.zoology.biostat"
        minSdk 23
        targetSdk 36
        versionCode 7
        versionName "6.0.0-native"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (ksPath) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv('BIOSTAT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BIOSTAT_KEY_ALIAS')
                keyPassword System.getenv('BIOSTAT_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksPath) signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }
    packagingOptions {
        resources {
            excludes += ['DebugProbesKt.bin', 'META-INF/*.version']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    testOptions {
        unitTests.includeAndroidResources = false
        unitTests.all {
            testLogging { exceptionFormat 'full'; events 'failed' }
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
