plugins {
    id 'com.android.application'
}

// Release signing is read from environment variables (set as GitHub Actions
// secrets). If they are absent the release build is produced unsigned.
def ksPath = System.getenv('BIOSTAT_KEYSTORE_PATH')

android {
    namespace 'com.gasc.zoology.biostat'
    compileSdk 36

    defaultConfig {
        applicationId "com.gasc.zoology.biostat"
        minSdk 23
        targetSdk 36
        versionCode 6
        versionName "5.0.0"
    }

    signingConfigs {
        if (ksPath) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv('BIOSTAT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BIOSTAT_KEY_ALIAS')
                keyPassword System.getenv('BIOSTAT_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksPath) signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }
    packagingOptions {
        resources {
            excludes += ['DebugProbesKt.bin', 'META-INF/*.version']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Align Kotlin stdlib artefacts (jdk7/jdk8 were merged into kotlin-stdlib in 1.8) to avoid duplicate classes.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'
}
