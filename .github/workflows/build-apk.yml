name: Build Android APK and AAB

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Quality gate — calculator regression tests
        run: node tests/test_calculators.js legacy-web/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android SDK platform 36 is installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore upload keystore (only if secrets are configured)
        env:
          KS_B64: ${{ secrets.BIOSTAT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "BIOSTAT_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Keystore restored: release artifacts will be signed."
          else
            echo "No keystore secret: release artifacts will be unsigned."
          fi

      - name: Native unit tests (content parity and models)
        run: gradle testDebugUnitTest --stacktrace

  emulator:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android SDK platform 36 is installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator UI tests (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash tools/ci_emulator.sh
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-qa-screenshots
          path: qa-screens/
          if-no-files-found: warn
      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: warn

  package:
    needs: [validate, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android SDK platform 36 is installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore upload keystore (only if secrets are configured)
        env:
          KS_B64: ${{ secrets.BIOSTAT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "BIOSTAT_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret: release artifacts will be unsigned."
          fi
      - name: Build debug APK (installable for testing) and release APK + AAB
        env:
          BIOSTAT_KEYSTORE_PASSWORD: ${{ secrets.BIOSTAT_KEYSTORE_PASSWORD }}
          BIOSTAT_KEY_ALIAS: ${{ secrets.BIOSTAT_KEY_ALIAS }}
          BIOSTAT_KEY_PASSWORD: ${{ secrets.BIOSTAT_KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Biostatistics-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Biostatistics-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload release AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: Biostatistics-release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
